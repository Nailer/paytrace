<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">How PayTrace connects a request to a verified payment</title><desc id="desc">A merchant prepares and publishes a request. A customer opens checkout and sends USDC directly to the merchant wallet on Monad. PayTrace verifies network evidence and stores a receipt in the private workspace. PayTrace never holds the funds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#427864"/></marker></defs><rect width="1200" height="740" rx="24" fill="#f7f9f5"/><g font-family="Arial, sans-serif" fill="#244c3c"><text x="48" y="58" font-size="14" letter-spacing="2">PAYTRACE / FROM REQUEST TO RECEIPT</text><text x="48" y="104" font-size="34" font-weight="bold">A payment link with evidence behind it.</text><text x="48" y="137" font-size="17" fill="#52675b">Follow the request, the transfer and the verification as three separate steps.</text><rect x="48" y="185" width="332" height="160" rx="16" fill="white" stroke="#d6e2d6"/><circle cx="79" cy="219" r="16" fill="#eaf1e6"/><text x="79" y="224" text-anchor="middle" font-size="13" font-weight="bold">1</text><text x="106" y="225" font-size="19" font-weight="bold">Prepare the request</text><text x="71" y="263" font-size="15" fill="#52675b">Set the amount and both wallets.</text><text x="71" y="288" font-size="15" fill="#52675b">Review as a guest. Sign in only</text><text x="71" y="313" font-size="15" fill="#52675b">when saving a live checkout link.</text><rect x="434" y="185" width="332" height="160" rx="16" fill="white" stroke="#d6e2d6"/><circle cx="465" cy="219" r="16" fill="#eaf1e6"/><text x="465" y="224" text-anchor="middle" font-size="13" font-weight="bold">2</text><text x="492" y="225" font-size="19" font-weight="bold">Share customer checkout</text><text x="457" y="263" font-size="15" fill="#52675b">The customer opens the link.</text><text x="457" y="288" font-size="15" fill="#52675b">They review the exact payment.</text><text x="457" y="313" font-size="15" fill="#52675b">No customer account is needed.</text><rect x="820" y="185" width="332" height="160" rx="16" fill="white" stroke="#d6e2d6"/><circle cx="851" cy="219" r="16" fill="#eaf1e6"/><text x="851" y="224" text-anchor="middle" font-size="13" font-weight="bold">3</text><text x="878" y="225" font-size="19" font-weight="bold">Pay directly on Monad</text><text x="843" y="263" font-size="15" fill="#52675b">Customer wallet → merchant wallet</text><text x="843" y="288" font-size="15" fill="#52675b">A wallet-approved USDC transfer.</text><text x="843" y="313" font-size="15" fill="#52675b">PayTrace never receives the funds.</text><rect x="820" y="425" width="332" height="160" rx="16" fill="white" stroke="#d6e2d6"/><circle cx="851" cy="459" r="16" fill="#eaf1e6"/><text x="851" y="464" text-anchor="middle" font-size="13" font-weight="bold">4</text><text x="878" y="465" font-size="19" font-weight="bold">Verify the chain evidence</text><text x="843" y="503" font-size="15" fill="#52675b">Check success, finalization, token,</text><text x="843" y="528" font-size="15" fill="#52675b">wallets, amount and request timing.</text><text x="843" y="553" font-size="15" fill="#52675b">Reject reused or mismatched proof.</text><rect x="434" y="425" width="332" height="160" rx="16" fill="white" stroke="#d6e2d6"/><circle cx="465" cy="459" r="16" fill="#eaf1e6"/><text x="465" y="464" text-anchor="middle" font-size="13" font-weight="bold">5</text><text x="492" y="465" font-size="19" font-weight="bold">Record the result</text><text x="457" y="503" font-size="15" fill="#52675b">Valid payment → received + receipt</text><text x="457" y="528" font-size="15" fill="#52675b">Mismatch → explanation / review</text><text x="457" y="553" font-size="15" fill="#52675b">Pending → wait and check again</text><rect x="48" y="425" width="332" height="160" rx="16" fill="white" stroke="#d6e2d6"/><circle cx="79" cy="459" r="16" fill="#eaf1e6"/><text x="79" y="464" text-anchor="middle" font-size="13" font-weight="bold">6</text><text x="106" y="465" font-size="19" font-weight="bold">Keep the payment trail</text><text x="71" y="503" font-size="15" fill="#52675b">Customer: view and export receipt.</text><text x="71" y="528" font-size="15" fill="#52675b">Merchant: private requests, notes,</text><text x="71" y="553" font-size="15" fill="#52675b">review inbox and ledger export.</text><path d="M380 265 H424" fill="none" stroke="#427864" stroke-width="3" marker-end="url(#arrow)"/><path d="M766 265 H810" fill="none" stroke="#427864" stroke-width="3" marker-end="url(#arrow)"/><path d="M986 345 V415" fill="none" stroke="#427864" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 505 H776" fill="none" stroke="#427864" stroke-width="3" marker-end="url(#arrow)"/><path d="M434 505 H390" fill="none" stroke="#427864" stroke-width="3" marker-end="url(#arrow)"/><text x="1010" y="388" font-size="13" fill="#52675b">Receipt + logs</text><rect x="48" y="624" width="1104" height="70" rx="14" fill="#eaf1e6"/><text x="72" y="653" font-size="16" font-weight="bold">Funds move between wallets. PayTrace stores the request and verification record.</text><text x="72" y="678" font-size="14" fill="#52675b">Current release: Monad testnet · Circle test USDC · no custody, fiat settlement or automatic refunds</text></g></svg>